<!DOCTYPE html>
<html lang="en">
<head>
<script src="../assets/js/tab-auth-context.js"></script>
<script defer src="../assets/js/notification-drawer.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Assets — ÆTHERYX SENTINEL</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap');

:root {
    --base: #0D1117; --surface: #151B26; --surface-2: #1B2330; --border: rgba(255,255,255,.08);
    --cyan: #4FE0C9; --violet: #8B6FEA; --text: #EEF2FF; --muted: #8E98B7;
    --danger: #F07F8B; --warning: #E8B45C; --good: #5FD98A;
    --sidebar: 230px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { min-height: 100vh; background: var(--base); color: var(--text); font-family: "IBM Plex Sans", sans-serif; }

.sidebar { position: fixed; left: 0; top: 0; bottom: 0; width: var(--sidebar); padding: 24px 16px; background: var(--surface); border-right: 1px solid var(--border); }
.brand { font-weight: 700; font-size: 1.05rem; margin-bottom: 4px; }
.brand span { color: var(--cyan); }
.tagline { font-size: .68rem; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; margin-bottom: 28px; }
.nav a { display: block; padding: 10px 12px; border-radius: 8px; color: var(--muted); text-decoration: none; font-size: .88rem; font-weight: 500; margin-bottom: 2px; }
.nav a.active, .nav a:hover { background: var(--surface-2); color: var(--text); }

main { margin-left: var(--sidebar); padding: 28px 32px 60px; max-width: 1280px; }
h1 { font-size: 1.5rem; font-weight: 700; }
.subtitle { color: var(--muted); font-size: .9rem; margin-top: 4px; margin-bottom: 20px; }

.toolbar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 18px; }
.toolbar input, .toolbar select {
    background: var(--surface); border: 1px solid var(--border); color: var(--text);
    border-radius: 8px; padding: 9px 12px; font-size: .86rem; font-family: inherit;
}
.toolbar input { flex: 1; min-width: 200px; }

.table-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: .86rem; min-width: 760px; }
th { text-align: left; padding: 12px 16px; color: var(--muted); font-weight: 600; font-size: .74rem; text-transform: uppercase; letter-spacing: .05em; border-bottom: 1px solid var(--border); }
td { padding: 12px 16px; border-bottom: 1px solid var(--border); }
tr:last-child td { border-bottom: none; }
tr.asset-row { cursor: pointer; }
tr.asset-row:hover { background: var(--surface-2); }

.badge { font-size: .68rem; font-weight: 600; padding: 3px 8px; border-radius: 999px; white-space: nowrap; text-transform: uppercase; letter-spacing: .03em; }
.badge.CRITICAL, .badge.RETIREMENT_REVIEW { background: rgba(240,127,139,.15); color: var(--danger); }
.badge.ATTENTION { background: rgba(232,180,92,.15); color: var(--warning); }
.badge.MONITOR { background: rgba(142,152,183,.15); color: var(--muted); }
.badge.HEALTHY { background: rgba(95,217,138,.15); color: var(--good); }

.health-num { font-family: "IBM Plex Mono", monospace; font-weight: 600; }

.state-message { color: var(--muted); font-size: .9rem; padding: 40px 20px; text-align: center; }

@media (max-width: 860px) { .sidebar { display: none; } main { margin-left: 0; padding: 20px; } }
</style>
</head>
<body>

<aside class="sidebar">
    <div class="brand">ÆTHERYX <span>SENTINEL</span></div>
    <div class="tagline">Precision · Clarity · Intelligence</div>
    <nav class="nav">
        <a href="sentinel-dashboard.html">Command Center</a>
        <a href="assets.html" class="active">Assets</a>
        <a href="maintenance.html">Maintenance</a>
        <a href="notifications.html">Notifications</a>
        <a href="activity-logs.html">Activity Logs</a>
        <a href="reports.html">Reports</a>
        <a href="profile.html">Profile</a>
        <a href="../admin/admin-dashboard.html">← Back to ÆTHERYX</a>
    </nav>
</aside>

<main>
    <h1>Assets</h1>
    <div class="subtitle">All registered equipment with Sentinel health and lifecycle state.</div>

    <div class="toolbar">
        <input type="search" id="searchInput" placeholder="Search by name or brand...">
        <select id="lifecycleFilter">
            <option value="">All lifecycle states</option>
            <option value="HEALTHY">Healthy</option>
            <option value="MONITOR">Monitor</option>
            <option value="ATTENTION">Attention</option>
            <option value="CRITICAL">Critical</option>
            <option value="RETIREMENT_REVIEW">Retirement Review</option>
        </select>
        <select id="categoryFilter"><option value="">All categories</option></select>
    </div>

    <div class="table-wrap">
        <table>
            <thead>
                <tr>
                    <th>Asset</th><th>Category</th><th>Status</th><th>Condition</th>
                    <th>Availability</th><th>Health</th><th>Lifecycle</th>
                </tr>
            </thead>
            <tbody id="assetTableBody">
                <tr><td colspan="7" class="state-message">Loading assets…</td></tr>
            </tbody>
        </table>
    </div>
</main>

<script>
function esc(v) {
    return String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

const API_URL = "../../backend/api/sentinel/assets/list.php";
let allAssets = [];

function badge(state) {
    return `<span class="badge ${esc(state)}">${esc(state.replace('_', ' '))}</span>`;
}

function healthColor(score) {
    if (score >= 80) return 'var(--good)';
    if (score >= 50) return 'var(--text)';
    if (score >= 25) return 'var(--warning)';
    return 'var(--danger)';
}

function render() {
    const search = document.getElementById('searchInput').value.toLowerCase().trim();
    const lifecycle = document.getElementById('lifecycleFilter').value;
    const category = document.getElementById('categoryFilter').value;

    const filtered = allAssets.filter(a => {
        const matchesSearch = !search || a.name.toLowerCase().includes(search) || (a.brand || '').toLowerCase().includes(search);
        const matchesLifecycle = !lifecycle || a.lifecycleState === lifecycle;
        const matchesCategory = !category || a.category === category;
        return matchesSearch && matchesLifecycle && matchesCategory;
    });

    const tbody = document.getElementById('assetTableBody');

    if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" class="state-message">No assets match these filters.</td></tr>`;
        return;
    }

    tbody.innerHTML = filtered.map(a => `
        <tr class="asset-row" onclick="location.href='asset-details.html?id=${a.id}'">
            <td><strong>${esc(a.name)}</strong><br><span style="color:var(--muted);font-size:.78rem">${esc(a.brand || '')}</span></td>
            <td>${esc(a.category)}</td>
            <td style="text-transform:capitalize">${esc(a.status)}</td>
            <td style="text-transform:capitalize">${esc(a.conditionStatus || '—')}</td>
            <td>${a.availableQuantity} / ${a.quantity}</td>
            <td class="health-num" style="color:${healthColor(a.healthScore)}">${a.healthScore}</td>
            <td>${badge(a.lifecycleState)}</td>
        </tr>
    `).join('');
}

async function load() {
    const tbody = document.getElementById('assetTableBody');
    try {
        const res = await fetch(API_URL, { credentials: 'include' });
        const payload = await res.json();

        if (!res.ok || !payload.success) {
            throw new Error(payload.message || 'Request failed');
        }

        allAssets = payload.assets;

        if (allAssets.length === 0) {
            tbody.innerHTML = `<tr><td colspan="7" class="state-message">No equipment has been registered yet.</td></tr>`;
            return;
        }

        const categories = [...new Set(allAssets.map(a => a.category))].sort();
        document.getElementById('categoryFilter').innerHTML =
            '<option value="">All categories</option>' +
            categories.map(c => `<option value="${esc(c)}">${esc(c)}</option>`).join('');

        render();

    } catch (err) {
        tbody.innerHTML = `<tr><td colspan="7" class="state-message">Sentinel couldn't load the asset list. Check that you're logged in as an administrator.</td></tr>`;
    }
}

document.getElementById('searchInput').addEventListener('input', render);
document.getElementById('lifecycleFilter').addEventListener('change', render);
document.getElementById('categoryFilter').addEventListener('change', render);

load();
</script>

</body>
</html>
