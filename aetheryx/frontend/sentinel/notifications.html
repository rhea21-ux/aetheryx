<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notifications — ÆTHERYX SENTINEL</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap');

:root {
    --base: #0D1117; --surface: #151B26; --surface-2: #1B2330; --border: rgba(255,255,255,.08);
    --cyan: #4FE0C9; --violet: #8B6FEA; --text: #EEF2FF; --muted: #8E98B7;
    --danger: #F07F8B; --warning: #E8B45C; --good: #5FD98A;
    --sidebar: 230px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { min-height: 100vh; background: var(--base); color: var(--text); font-family: "IBM Plex Sans", sans-serif; }

.sidebar { position: fixed; left: 0; top: 0; bottom: 0; width: var(--sidebar); padding: 24px 16px; background: var(--surface); border-right: 1px solid var(--border); }
.brand { font-weight: 700; font-size: 1.05rem; margin-bottom: 4px; }
.brand span { color: var(--cyan); }
.tagline { font-size: .68rem; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; margin-bottom: 28px; }
.nav a { display: block; padding: 10px 12px; border-radius: 8px; color: var(--muted); text-decoration: none; font-size: .88rem; font-weight: 500; margin-bottom: 2px; }
.nav a.active, .nav a:hover { background: var(--surface-2); color: var(--text); }

main { margin-left: var(--sidebar); padding: 28px 32px 60px; max-width: 820px; }
h1 { font-size: 1.5rem; font-weight: 700; }
.subtitle { color: var(--muted); font-size: .9rem; margin-top: 4px; margin-bottom: 20px; }

.panel { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; }
.notif-row { display: flex; gap: 12px; padding: 14px 20px; border-bottom: 1px solid var(--border); align-items: flex-start; }
.notif-row:last-child { border-bottom: none; }
.notif-row.unread { background: rgba(79,224,201,.04); }
.dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 6px; flex-shrink: 0; background: var(--border); }
.notif-row.unread .dot { background: var(--cyan); }
.notif-title { font-weight: 600; font-size: .9rem; }
.notif-msg { font-size: .84rem; color: var(--muted); margin-top: 2px; }
.notif-time { font-size: .74rem; color: var(--muted); font-family: "IBM Plex Mono", monospace; margin-top: 4px; }

.type-tag { font-size: .66rem; font-weight: 600; padding: 2px 8px; border-radius: 6px; text-transform: uppercase; margin-left: auto; white-space: nowrap; }
.type-tag.info { background: rgba(142,152,183,.15); color: var(--muted); }
.type-tag.success { background: rgba(95,217,138,.15); color: var(--good); }
.type-tag.warning { background: rgba(232,180,92,.15); color: var(--warning); }
.type-tag.danger { background: rgba(240,127,139,.15); color: var(--danger); }

.state-message { color: var(--muted); font-size: .9rem; padding: 40px 20px; text-align: center; }

@media (max-width: 860px) { .sidebar { display: none; } main { margin-left: 0; padding: 20px; } }
</style>
</head>
<body>

<aside class="sidebar">
    <div class="brand">ÆTHERYX <span>SENTINEL</span></div>
    <div class="tagline">Precision · Clarity · Intelligence</div>
    <nav class="nav">
        <a href="sentinel-dashboard.html">Command Center</a>
        <a href="assets.html">Assets</a>
        <a href="maintenance.html">Maintenance</a>
        <a href="notifications.html" class="active">Notifications</a>
        <a href="activity-logs.html">Activity Logs</a>
        <a href="reports.html">Reports</a>
        <a href="profile.html">Profile</a>
        <a href="../admin/admin-dashboard.html">← Back to ÆTHERYX</a>
    </nav>
</aside>

<main>
    <h1>Notifications</h1>
    <div class="subtitle">Updates on your maintenance requests and assignments.</div>

    <div class="panel" id="panel">
        <div class="state-message">Loading notifications…</div>
    </div>
</main>

<script>
function esc(v) {
    return String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

const API_URL = "../../backend/api/notifications/list.php";

function timeAgo(iso) {
    const diffMs = Date.now() - new Date(iso.replace(' ', 'T')).getTime();
    const mins = Math.floor(diffMs / 60000);
    if (mins < 60) return mins + 'm ago';
    const hrs = Math.floor(mins / 60);
    if (hrs < 24) return hrs + 'h ago';
    return Math.floor(hrs / 24) + 'd ago';
}

async function load() {
    const panel = document.getElementById('panel');
    try {
        const res = await fetch(API_URL, { credentials: 'include' });
        const payload = await res.json();
        if (!res.ok || !payload.success) throw new Error(payload.message);

        const notifications = payload.notifications;

        if (notifications.length === 0) {
            panel.innerHTML = '<div class="state-message">No notifications yet.</div>';
            return;
        }

        panel.innerHTML = notifications.map(n => `
            <div class="notif-row ${n.is_read ? '' : 'unread'}">
                <span class="dot"></span>
                <div style="flex:1">
                    <div class="notif-title">${esc(n.title)}</div>
                    <div class="notif-msg">${esc(n.message)}</div>
                    <div class="notif-time">${timeAgo(n.created_at)}</div>
                </div>
                <span class="type-tag ${esc(n.type)}">${esc(n.type)}</span>
            </div>
        `).join('');

    } catch (err) {
        panel.innerHTML = '<div class="state-message">Sentinel couldn\'t load notifications. Make sure you\'re logged in.</div>';
    }
}

load();
</script>

</body>
</html>
